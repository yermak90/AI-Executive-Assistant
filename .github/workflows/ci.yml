name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (tests + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_executive_assistant
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_executive_assistant_test
      APP_TIMEZONE: Asia/Almaty
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ai_executive_assistant;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ai_executive_assistant_test;"

      - name: Alembic upgrade / downgrade / upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        run: python -m pytest -v

  mobile:
    name: Mobile (typecheck + build validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Android export
        run: npx expo export --platform android --output-dir /tmp/expo-export
